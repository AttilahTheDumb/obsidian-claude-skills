name: capture-durable-preference
stage: capture
description: >
  A durable preference stated without any of the article's reference-implementation
  trigger phrases ("i prefer", "i always", "i never", "my rule is"). Its keyword classifier
  would miss this entirely. Tests that Claude's judgment (via /remember or /compress step 6)
  catches durable facts regardless of phrasing.
turns:
  - "just give me the diff notes, skip the summary paragraph, I don't need the preamble"
  - "yeah that's basically how I want every review from now on"
expect:
  captured: true
  class: durable
  subject_like: code-review-style   # exact slug may vary, should be about review style
  confidence_min: 0.7
notes: >
  If the implementation under test rejects this because it doesn't match a keyword list,
  that's the exact regression this scenario exists to catch.
